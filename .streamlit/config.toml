# The dashboard's look: night navy, ember orange for burning, satellite blue for data.
# Community Cloud reads this file from the repository root, even though the app is in dashboard/.

[client]
# Viewers see a plain toolbar, without the developer options.
toolbarMode = "viewer"

[server]
# Serves dashboard/static/ (the fonts and the logo) at app/static/.
enableStaticServing = true

[theme]
base = "dark"
primaryColor = "#ff7b39"
backgroundColor = "#0b1322"
secondaryBackgroundColor = "#121d31"
textColor = "#e8eef7"
linkColor = "#8cc8ff"
codeTextColor = "#c6d2e2"
codeBackgroundColor = "#16233a"
borderColor = "#22324c"
dataframeBorderColor = "#22324c"
dataframeHeaderBackgroundColor = "#121d31"
showSidebarBorder = true
baseRadius = "0.6rem"
font = "Hind, sans-serif"
headingFont = "Rajdhani, sans-serif"
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontSize = "2.3rem"
metricValueFontWeight = 600
# Checked for colour-blind safety and 3:1 contrast on the navy background.
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.sidebar]
backgroundColor = "#0e182a"
secondaryBackgroundColor = "#16233a"

# Rajdhani (headings and numbers) and Hind (text), both by Indian Type Foundry, SIL Open Font License 1.1
# (dashboard/static/OFL-*.txt).
[[theme.fontFaces]]
family = "Rajdhani"
url = "app/static/rajdhani-500.woff2"
weight = 500

[[theme.fontFaces]]
family = "Rajdhani"
url = "app/static/rajdhani-600.woff2"
weight = 600

[[theme.fontFaces]]
family = "Rajdhani"
url = "app/static/rajdhani-700.woff2"
weight = 700

[[theme.fontFaces]]
family = "Hind"
url = "app/static/hind-400.woff2"
weight = 400

[[theme.fontFaces]]
family = "Hind"
url = "app/static/hind-500.woff2"
weight = 500

[[theme.fontFaces]]
family = "Hind"
url = "app/static/hind-600.woff2"
weight = 600
